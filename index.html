<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>طلب احتياج مشروع - جمعية الرحمة العالمية</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet"><style>  :root{    --ink:#1a2e26; --paper:#f4f7f5; --line:#cce0d6;    --teal:#006838; --teal-d:#004d28; --ochre:#d4af37; --ochre-d:#b3922d;    --card:#ffffff; --muted:#556b60; --danger:#b33939; --ok:#2f855a;    font-family:'Tajawal',system-ui,sans-serif;  }  *{box-sizing:border-box;}  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);}  .wrap{max-width:640px;margin:0 auto;padding:0 18px;}  header{padding:36px 0 22px;border-bottom:2px solid var(--teal);}  header h1{font-size:1.6rem;font-weight:900;margin:0 0 8px;color:var(--teal);line-height:1.35;}  header p{margin:0;color:var(--muted);font-size:.95rem;line-height:1.7;max-width:48ch;}  .section{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;box-shadow:0 4px 12px rgba(0,104,56,0.03);}  .section h2{font-size:1.05rem;margin:0 0 4px;font-weight:700;color:var(--teal-d);}  .section .hint{color:var(--muted);font-size:.85rem;margin:0 0 16px;}  label{display:block;font-size:.9rem;font-weight:500;margin:14px 0 6px;}  label.req::after{content:" *";color:var(--danger);}  input[type=text], input[type=tel], input[type=number], select, textarea{    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;    background:var(--paper);color:var(--ink);font-family:inherit;font-size:.95rem;  }  textarea{min-height:88px;resize:vertical;}  input:focus, select:focus, textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}  @media (max-width:480px){.row2{grid-template-columns:1fr;}}  .submit-btn{width:100%;margin-top:24px;background:var(--teal);color:#fff;border:none;border-radius:11px;padding:15px;font-family:inherit;font-weight:900;font-size:1.02rem;cursor:pointer;box-shadow:0 4px 10px rgba(0,104,56,0.2);}  .status{margin-top:14px;font-size:.9rem;border-radius:9px;padding:10px 12px;display:none;}  .status.show{display:block;}  .status.ok{background:rgba(47,133,90,.12);color:var(--ok);}  .status.err{background:rgba(179,57,57,.12);color:var(--danger);}  footer{margin-top:40px;text-align:center;color:var(--muted);font-size:.8rem;}</style></head><body><div class="wrap">  <header>    <h1>نموذج طلب احتياج مشروع</h1>    <p>تُستقبل طلبات المشاريع التنموية والخيرية للمناطق المحتاجة — مساجد، آبار، مدارس، وغيرها.</p>  </header>  <form id="reqForm">    <div class="section">      <h2>نوع المشروع</h2>      <label class="req">نوع المشروع</label>      <select id="projType" required>        <option value="">اختر نوع المشروع</option>        <option value="مسجد">مسجد</option>        <option value="بئر ارتوازي">بئر ارتوازي</option>        <option value="مدرسة">مدرسة</option>        <option value="مركز صحي / مستوصف">مركز صحي / مستوصف</option>      </select>      <label>عدد المستفيدين بالمنطقة</label>      <input type="number" id="beneficiaries" min="0" placeholder="مثال: 300">    </div>    <div class="section">      <h2>بيانات مقدّم الطلب</h2>      <div class="row2">        <div>          <label class="req">الاسم / الجهة</label>          <input type="text" id="applicant" required placeholder="الاسم الكامل أو اسم الجهة">        </div>        <div>          <label class="req">رقم التواصل</label>          <input type="tel" id="phone" required placeholder="05xxxxxxxx">        </div>      </div>    </div>    <div class="section">      <h2>موقع المشروع</h2>      <div class="row2">        <div>          <label class="req">الدولة / المنطقة الإدارية</label>          <input type="text" id="region" required placeholder="مثال: محافظة ...">        </div>        <div>          <label class="req">المدينة / القرية</label>          <input type="text" id="city" required placeholder="اسم المدينة أو القرية">        </div>      </div>    </div>    <div class="section">      <h2>تفاصيل الاحتياج</h2>      <label class="req">سبب الاحتياج للمشروع</label>      <textarea id="reason" required placeholder="اشرح سبب الحاجة لهذا المشروع في هذه المنطقة"></textarea>    </div>    <button type="submit" class="submit-btn" id="submitBtn">إرسال الطلب</button>    <div class="status" id="statusBox"></div>  </form>  <footer>البيانات تُحفظ بشكل آمن خاصة بهذه الصفحة</footer></div></body></html>
